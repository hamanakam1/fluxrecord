name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Boundary check
        run: python3 -m unittest tests.test_boundaries -v

      - name: Specification check
        run: python3 -m unittest tests.test_spec_conformance -v

      - name: Output shape check
        run: python3 -m unittest tests.test_no_null_keys -v

      - name: Chain check
        run: python3 -m unittest tests.test_chain -v

      - name: Published schema check
        run: python3 -m unittest tests.test_published_schema -v

      - name: Conformance suite
        run: python3 conformance/run.py

      - name: Report coverage
        run: |
          python -c "import pathlib, site; pathlib.Path(site.getsitepackages()[0], 'coverage.pth').write_text('import coverage; coverage.process_startup()')"
          COVERAGE_PROCESS_START=$PWD/pyproject.toml python -m coverage run -m unittest discover -s tests
          python -m coverage combine
          python -m coverage report

      - name: Type check
        run: mypy fluxrecord/

      - name: Lint
        run: ruff check fluxrecord/

      - name: Format check
        run: ruff format --check fluxrecord/

  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}